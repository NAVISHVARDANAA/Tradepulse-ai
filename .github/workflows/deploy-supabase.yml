name: Deploy Supabase production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PHASE_4B to release pending migrations and verify brokerage safety controls
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations and deploy Edge Function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release confirmation and secrets
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          test "$RELEASE_CONFIRMATION" = "DEPLOY_PHASE_4B" || {
            echo "Release confirmation did not match DEPLOY_PHASE_4B."
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_ACCESS_TOKEN is not configured in the production environment."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "SUPABASE_DB_PASSWORD is not configured in the production environment."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "SUPABASE_PROJECT_REF is not configured in the production environment."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the repository-pinned Supabase CLI
        run: npm ci

      - name: Preview pending database migrations
        run: >-
          npx --no-install supabase db push
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
          --dry-run

      - name: Apply pending database migrations
        run: >-
          npx --no-install supabase db push
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
          --yes

      - name: Deploy the blocked brokerage-preview function
        run: >-
          npx --no-install supabase functions deploy preview-brokerage-order
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Verify migration history
        run: |
          set -eu
          npx --no-install supabase migration list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" | tee migration-list.txt
          grep -Eq '(^|[^0-9])015([^0-9]|$)' migration-list.txt

      - name: Verify the deployed Edge Function
        run: |
          set -eu
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "preview-brokerage-order" and .status == "ACTIVE")'

      - name: Assert production smoke SQL is query-only
        run: bash scripts/assert-read-only-sql.sh supabase/tests/production/brokerage_readiness_smoke.sql

      - name: Verify production execution locks
        run: >-
          npx --no-install supabase db query
          --linked
          --project-ref "$SUPABASE_PROJECT_REF"
          --file supabase/tests/production/brokerage_readiness_smoke.sql

      - name: Verify unauthenticated previews remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output function-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/preview-brokerage-order")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated 401 response; received $status_code."
            exit 1
          }

      - name: Write deployment summary
        run: |
          {
            echo "## Supabase production deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Migration 015: verified"
            echo "- Broker sandbox certification controls: verified"
            echo "- preview-brokerage-order: ACTIVE"
            echo "- Production execution locks: verified"
            echo "- Unauthenticated preview request: blocked with HTTP 401"
          } >> "$GITHUB_STEP_SUMMARY"
