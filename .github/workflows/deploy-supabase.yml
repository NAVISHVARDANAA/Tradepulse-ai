name: Deploy Supabase production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PHASE_4A to release pending migrations and the brokerage preview function
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations and deploy Edge Function
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate release confirmation and secrets
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          test "$RELEASE_CONFIRMATION" = "DEPLOY_PHASE_4A" || {
            echo "Release confirmation did not match DEPLOY_PHASE_4A."
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_ACCESS_TOKEN is not configured in the production environment."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "SUPABASE_DB_PASSWORD is not configured in the production environment."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "SUPABASE_PROJECT_REF is not configured in the production environment."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the repository-pinned Supabase CLI
        run: npm ci

      - name: Preview pending database migrations
        run: >-
          npx --no-install supabase db push
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
          --dry-run

      - name: Apply pending database migrations
        run: >-
          npx --no-install supabase db push
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
          --yes

      - name: Deploy the blocked brokerage-preview function
        run: >-
          npx --no-install supabase functions deploy preview-brokerage-order
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Verify migration history
        run: |
          set -eu
          npx --no-install supabase migration list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" | tee migration-list.txt
          grep -Eq '(^|[^0-9])014([^0-9]|$)' migration-list.txt

      - name: Verify the deployed Edge Function
        run: |
          set -eu
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "preview-brokerage-order" and .status == "ACTIVE")'
