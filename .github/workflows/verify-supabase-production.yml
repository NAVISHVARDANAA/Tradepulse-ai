name: Verify Supabase production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_DATA_PHASE_6B to verify the sandbox-order lifecycle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify migrations, function and execution locks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      WEB_SUPABASE_ANON_KEY: ${{ secrets.WEB_SUPABASE_ANON_KEY }}

    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate verification confirmation and secrets
        env:
          VERIFICATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          test "$VERIFICATION_CONFIRMATION" = "VERIFY_DATA_PHASE_6B" || {
            echo "Verification confirmation did not match VERIFY_DATA_PHASE_6B."
            exit 1
          }
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_ACCESS_TOKEN is not configured in the production environment."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "SUPABASE_DB_PASSWORD is not configured in the production environment."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "SUPABASE_PROJECT_REF is not configured in the production environment."
            exit 1
          }
          test -n "$WEB_SUPABASE_ANON_KEY" || {
            echo "WEB_SUPABASE_ANON_KEY is not configured in the production environment."
            exit 1
          }

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the repository-pinned Supabase CLI
        run: npm ci

      - name: Verify migration 037 and remote migration parity
        run: |
          set -eu
          npx --no-install supabase migration list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" | tee migration-list.txt
          grep -Eq '(^|[^0-9])037([^0-9]|$)' migration-list.txt
          npx --no-install supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run 2>&1 | tee migration-dry-run.txt
          if grep -q 'Would push these migrations' migration-dry-run.txt; then
            echo "Remote production has pending migrations."
            exit 1
          fi

      - name: Verify production public web reads
        run: bash scripts/verify-public-runtime-read.sh

      - name: Assert production smoke SQL is query-only
        run: bash scripts/assert-read-only-sql.sh supabase/tests/production/brokerage_readiness_smoke.sql

      - name: Verify production execution locks
        run: >-
          npx --no-install supabase db query
          --linked
          --project-ref "$SUPABASE_PROJECT_REF"
          --file supabase/tests/production/brokerage_readiness_smoke.sql

      - name: Verify approved-tester pilot production boundary
        run: |
          bash scripts/assert-read-only-sql.sh supabase/tests/production/approved_tester_pilot_smoke.sql
          npx --no-install supabase db query \
            --linked \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --file supabase/tests/production/approved_tester_pilot_smoke.sql

      - name: Verify regulated preflight production boundary
        run: |
          bash scripts/assert-read-only-sql.sh supabase/tests/production/regulated_preflight_smoke.sql
          npx --no-install supabase db query \
            --linked \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --file supabase/tests/production/regulated_preflight_smoke.sql

      - name: Verify sandbox order production boundary
        run: |
          bash scripts/assert-read-only-sql.sh supabase/tests/production/sandbox_order_lifecycle_smoke.sql
          npx --no-install supabase db query \
            --linked \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --file supabase/tests/production/sandbox_order_lifecycle_smoke.sql

      - name: Verify the deployed Edge Function
        run: |
          set -eu
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "preview-brokerage-order" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "evaluate-regulated-preflight" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "probe-alpaca-broker-sandbox" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "sync-alpaca-sandbox-account-inventory" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "manage-alpaca-sandbox-order" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "evaluate-broker-operations" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "submit-paper-order" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "refresh-paper-risk" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "evaluate-forecast-governance" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "generate-equity-research" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "evaluate-platform-reliability" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "manage-account-security" and .status == "ACTIVE")'
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -e \
              '.[] | select(.name == "evaluate-data-quality" and .status == "ACTIVE")'

      - name: Verify all shared-security functions are active
        run: |
          set -eu
          npx --no-install supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json > deployed-functions.json
          for function_name in \
            create-payment-quote \
            create-paper-portfolio \
            submit-paper-order \
            refresh-paper-risk \
            set-paper-trading-control \
            generate-daily-research-brief \
            manage-account-security \
            sync-fx-market-data \
            generate-market-forecasts \
            sync-equity-market-data \
            sync-sec-equity-fundamentals
          do
            jq -e --arg name "$function_name" \
              '.[] | select(.name == $name and .status == "ACTIVE")' \
              deployed-functions.json
          done

      - name: Verify unauthenticated previews remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output function-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/preview-brokerage-order")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated 401 response; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated regulated preflight remains blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output preflight-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/evaluate-regulated-preflight")"
          test "$status_code" = "401" || {
            echo "Expected unauthenticated regulated preflight to return 401; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated account-security actions remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output account-security-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"status"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/manage-account-security")"
          test "$status_code" = "401" || {
            echo "Expected unauthenticated account-security access to return 401; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated broker probes remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --dump-header broker-probe-headers.txt \
            --output broker-probe-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/probe-alpaca-broker-sandbox")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated broker-probe 401 response; received $status_code."
            exit 1
          }
          if grep -qi '^access-control-allow-origin:' broker-probe-headers.txt; then
            echo "Internal broker probe unexpectedly enabled browser CORS."
            exit 1
          fi

      - name: Verify sandbox order lifecycle is internal-only
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --dump-header sandbox-order-headers.txt \
            --output sandbox-order-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/manage-alpaca-sandbox-order")"
          test "$status_code" = "401" || {
            echo "Expected unauthenticated sandbox order lifecycle to return 401; received $status_code."
            exit 1
          }
          if grep -qi '^access-control-allow-origin:' sandbox-order-headers.txt; then
            echo "Internal sandbox order lifecycle unexpectedly enabled browser CORS."
            exit 1
          fi

      - name: Verify unauthenticated platform evaluations remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --dump-header platform-reliability-headers.txt \
            --output platform-reliability-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/evaluate-platform-reliability")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated platform-reliability 401 response; received $status_code."
            exit 1
          }
          if grep -qi '^access-control-allow-origin:' platform-reliability-headers.txt; then
            echo "Internal platform evaluator unexpectedly enabled browser CORS."
            exit 1
          fi

      - name: Verify unauthenticated data-quality evaluations remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent --show-error \
            --dump-header data-quality-headers.txt \
            --output data-quality-response.json \
            --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/evaluate-data-quality")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated data-quality 401 response; received $status_code."
            exit 1
          }
          if grep -qi '^access-control-allow-origin:' data-quality-headers.txt; then
            echo "Internal data-quality evaluator unexpectedly enabled browser CORS."
            exit 1
          fi

      - name: Verify unauthenticated account inventory syncs remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output account-inventory-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/sync-alpaca-sandbox-account-inventory")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated account-inventory 401 response; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated broker operations evaluations remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output broker-operations-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/evaluate-broker-operations")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated broker-operations 401 response; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated paper-order submissions remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output paper-order-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/submit-paper-order")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated paper-order 401 response; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated paper-risk refreshes remain blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output paper-risk-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/refresh-paper-risk")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated paper-risk 401 response; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated forecast governance remains blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output forecast-governance-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/evaluate-forecast-governance")"
          test "$status_code" = "401" || {
            echo "Expected an unauthenticated forecast-governance 401 response; received $status_code."
            exit 1
          }

      - name: Verify unauthenticated equity research generation remains blocked
        run: |
          set -eu
          status_code="$(curl \
            --silent \
            --show-error \
            --output equity-research-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/generate-equity-research")"
          test "$status_code" = "401" || {
            echo "Expected unauthenticated equity-research generation to return 401; received $status_code."
            exit 1
          }

      - name: Write verification summary
        run: |
          {
            echo "## Supabase production verification"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Migration history: synchronized through 034"
            echo "- Public market, forecast, equity, Academy and indicative-corridor reads: verified"
            echo "- Role-controlled shared Business research: verified"
            echo "- Bounded Business invitations and role administration: verified"
            echo "- Private Business workspace and role boundary: verified"
            echo "- Deterministic fourteen-day trial window: verified"
            echo "- Private customer feedback and support boundary: verified"
            echo "- Customer preferences and durable onboarding: verified"
            echo "- Subscription reconciliation: verified"
            echo "- Checkout and charge collection: disabled"
            echo "- Optional TOTP MFA and enrolled-session step-up: verified"
            echo "- Private account security history: verified"
            echo "- Internal scheduler CORS isolation: verified"
            echo "- Alpaca Broker API sandbox route lock: verified"
            echo "- preview-brokerage-order: ACTIVE"
            echo "- probe-alpaca-broker-sandbox: ACTIVE"
            echo "- sync-alpaca-sandbox-account-inventory: ACTIVE"
            echo "- evaluate-broker-operations: ACTIVE"
            echo "- submit-paper-order: ACTIVE"
            echo "- refresh-paper-risk: ACTIVE"
            echo "- evaluate-forecast-governance: ACTIVE"
            echo "- generate-equity-research: ACTIVE"
            echo "- manage-account-security: ACTIVE"
            echo "- evaluate-data-quality: ACTIVE"
            echo "- Hourly data-trust evaluation: verified"
            echo "- External email and push delivery: disabled"
            echo "- Production execution locks: verified"
            echo "- Unauthenticated preview request: blocked with HTTP 401"
            echo "- Unauthenticated data-quality request: blocked with HTTP 401"
            echo "- Unauthenticated account-security request: blocked with HTTP 401"
            echo "- Unauthenticated broker probe: blocked with HTTP 401"
            echo "- Unauthenticated account inventory: blocked with HTTP 401"
            echo "- Unauthenticated broker operations evaluation: blocked with HTTP 401"
            echo "- Unauthenticated paper-order submission: blocked with HTTP 401"
            echo "- Unauthenticated paper-risk refresh: blocked with HTTP 401"
            echo "- Unauthenticated forecast governance: blocked with HTTP 401"
            echo "- Unauthenticated equity research generation: blocked with HTTP 401"
            echo "- Production writes performed: none"
          } >> "$GITHUB_STEP_SUMMARY"
