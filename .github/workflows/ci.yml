name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify governed Analytics Studio contract
        run: npm run check:analytics

      - name: Verify invite-only controlled-beta access
        run: npm run check:beta-access

      - name: Verify controlled-beta operations workspace
        run: npm run check:beta-operations

      - name: Verify route-aware data loading
        run: npm run check:data-loading

      - name: Verify customer trust layer
        run: npm run check:trust-layer

      - name: Verify approved-tester pilot
        run: npm run check:approved-pilot

      - name: Verify beta hardening
        run: npm run check:beta-hardening

      - name: Verify regulated preflight
        run: npm run check:regulated-preflight

      - name: Verify production experience contract
        run: npm run check:production-experience

      - name: Enforce frontend performance budgets
        run: npm run check:bundle

      - name: Verify production web artifact boundary
        run: npm run check:release

      - name: Verify product navigation contract
        run: npm run check:navigation

      - name: Verify security regression contract
        run: npm run check:security

      - name: Verify controlled-beta release readiness
        run: npm run check:beta

      - name: Verify Cloudflare Pages hosting contract
        run: npm run check:hosting

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check browser tests
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps --only-shell chromium

      - name: Test controlled-beta browser boundaries
        run: npm run test:e2e

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js for shared type dependencies
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked shared type dependencies
        run: npm ci --ignore-scripts

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/sync-fx-market-data/index.ts
          deno check supabase/functions/generate-market-forecasts/index.ts
          deno check supabase/functions/create-payment-quote/index.ts
          deno check supabase/functions/create-paper-portfolio/index.ts
          deno check supabase/functions/submit-paper-order/index.ts
          deno check supabase/functions/refresh-paper-risk/index.ts
          deno check supabase/functions/set-paper-trading-control/index.ts
          deno check supabase/functions/sync-equity-market-data/index.ts
          deno check supabase/functions/generate-equity-research/index.ts
          deno check supabase/functions/sync-sec-equity-fundamentals/index.ts
          deno check supabase/functions/generate-daily-research-brief/index.ts
          deno check supabase/functions/preview-brokerage-order/index.ts
          deno check supabase/functions/evaluate-regulated-preflight/index.ts
          deno check supabase/functions/probe-alpaca-broker-sandbox/index.ts
          deno check supabase/functions/sync-alpaca-sandbox-account-inventory/index.ts
          deno check supabase/functions/evaluate-broker-operations/index.ts
          deno check supabase/functions/evaluate-forecast-governance/index.ts
          deno check supabase/functions/evaluate-platform-reliability/index.ts
          deno check supabase/functions/manage-account-security/index.ts
          deno check supabase/functions/evaluate-data-quality/index.ts

      - name: Test shared Edge Function security controls
        run: >-
          deno test --allow-env
          supabase/functions/_shared/http.test.ts
          supabase/functions/_shared/auth.test.ts
          supabase/functions/_shared/accountSecurity.test.ts
          supabase/functions/_shared/observability.test.ts
          supabase/functions/_shared/alpacaBrokerSandbox.test.ts
          supabase/functions/_shared/regulatedPreflight.test.ts

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Supabase Postgres
        run: >-
          npx --no-install supabase start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Rebuild database from migrations
        run: npx --no-install supabase db reset --local --no-seed

      - name: Test risk-engine database contracts
        run: npx --no-install supabase test db supabase/tests/database/portfolio_risk_engine.test.sql

      - name: Test paper decision-intelligence contracts
        run: npx --no-install supabase test db supabase/tests/database/paper_decision_intelligence.test.sql

      - name: Test forecast reliability-governance contracts
        run: npx --no-install supabase test db supabase/tests/database/forecast_reliability_governance.test.sql

      - name: Test equity-research database contracts
        run: npx --no-install supabase test db supabase/tests/database/equity_research_foundation.test.sql

      - name: Test research-copilot database contracts
        run: npx --no-install supabase test db supabase/tests/database/research_copilot.test.sql

      - name: Test TradePulse Academy database contracts
        run: npx --no-install supabase test db supabase/tests/database/tradepulse_academy.test.sql

      - name: Test public web runtime read boundary
        run: npx --no-install supabase test db supabase/tests/database/public_runtime_read_boundary.test.sql

      - name: Test brokerage-readiness database contracts
        run: npx --no-install supabase test db supabase/tests/database/brokerage_readiness.test.sql

      - name: Test regulated-preflight database contracts
        run: npx --no-install supabase test db supabase/tests/database/regulated_preflight.test.sql

      - name: Test broker-sandbox certification contracts
        run: npx --no-install supabase test db supabase/tests/database/broker_sandbox_certification.test.sql

      - name: Test Alpaca broker-sandbox adapter contracts
        run: npx --no-install supabase test db supabase/tests/database/alpaca_broker_sandbox_adapter.test.sql

      - name: Test Alpaca sandbox account-inventory contracts
        run: npx --no-install supabase test db supabase/tests/database/alpaca_sandbox_account_inventory.test.sql

      - name: Test broker operations monitoring contracts
        run: npx --no-install supabase test db supabase/tests/database/broker_operations_monitoring.test.sql

      - name: Test customer trust and API abuse-control contracts
        run: npx --no-install supabase test db supabase/tests/database/customer_trust_security.test.sql

      - name: Test platform observability and incident contracts
        run: npx --no-install supabase test db supabase/tests/database/platform_observability_incidents.test.sql

      - name: Test customer account-security contracts
        run: npx --no-install supabase test db supabase/tests/database/account_security_center.test.sql

      - name: Test customer privacy-center contracts
        run: npx --no-install supabase test db supabase/tests/database/customer_privacy_center.test.sql

      - name: Test data-trust and notification contracts
        run: npx --no-install supabase test db supabase/tests/database/data_trust_notifications.test.sql

      - name: Test monetization-foundation contracts
        run: npx --no-install supabase test db supabase/tests/database/monetization_foundation.test.sql

      - name: Test customer-experience contracts
        run: npx --no-install supabase test db supabase/tests/database/customer_experience_foundation.test.sql

      - name: Test customer feedback and support contracts
        run: npx --no-install supabase test db supabase/tests/database/customer_feedback_support.test.sql

      - name: Test approved-tester pilot contracts
        run: npx --no-install supabase test db supabase/tests/database/approved_tester_pilot.test.sql

      - name: Test Business workspace contracts
        run: npx --no-install supabase test db supabase/tests/database/business_workspace_foundation.test.sql

      - name: Test Business team-access contracts
        run: npx --no-install supabase test db supabase/tests/database/business_team_access.test.sql

      - name: Test shared Business-research contracts
        run: npx --no-install supabase test db supabase/tests/database/business_shared_research.test.sql

      - name: Assert production smoke SQL is query-only
        run: bash scripts/assert-read-only-sql.sh supabase/tests/production/brokerage_readiness_smoke.sql

      - name: Test production execution-lock smoke query
        run: >-
          npx --no-install supabase db query
          --local
          --file supabase/tests/production/brokerage_readiness_smoke.sql

      - name: Assert regulated preflight production smoke SQL is query-only
        run: bash scripts/assert-read-only-sql.sh supabase/tests/production/regulated_preflight_smoke.sql

      - name: Test regulated preflight production smoke query
        run: >-
          npx --no-install supabase db query
          --local
          --file supabase/tests/production/regulated_preflight_smoke.sql

      - name: Stop isolated Supabase services
        if: always()
        run: npx --no-install supabase stop --no-backup

  ml-forecasting:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/forecasting/pyproject.toml

      - name: Install forecasting service
        run: python -m pip install ./services/forecasting

      - name: Test forecasting engine
        run: python -m unittest discover -s services/forecasting/tests -v
