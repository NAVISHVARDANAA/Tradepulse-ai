name: Deploy controlled beta web

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PHASE_6A to deploy the regulated preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-beta-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.WEB_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate deployment confirmation and configuration
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          test "$RELEASE_CONFIRMATION" = "DEPLOY_PHASE_6A"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$VITE_SUPABASE_ANON_KEY"
          case "$CLOUDFLARE_ACCOUNT_ID" in *[!a-fA-F0-9]*) echo "Invalid Cloudflare account ID."; exit 1;; esac
          case "$CLOUDFLARE_PAGES_PROJECT" in *[!a-z0-9-]*) echo "Invalid Cloudflare Pages project name."; exit 1;; esac
          case "$VITE_SUPABASE_ANON_KEY" in *service_role*|*secret*) echo "A server credential cannot be used by the web client."; exit 1;; esac
          echo "VITE_SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run build
      - run: npm run check:analytics
      - run: npm run check:beta-access
      - run: npm run check:beta-operations
      - run: npm run check:data-loading
      - run: npm run check:trust-layer
      - run: npm run check:approved-pilot
      - run: npm run check:beta-hardening
      - run: npm run check:regulated-preflight
      - run: npm run check:production-experience
      - run: npm run check:bundle
      - run: npm run check:release
      - run: npm run check:navigation
      - run: npm run check:security
      - run: npm run check:beta
      - run: npm run check:hosting
      - name: Deploy immutable commit to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
      - name: Verify deployed candidate
        env:
          WEB_DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: npm run verify:web-deployment -- "$WEB_DEPLOYMENT_URL"
      - name: Install Chromium for deployed experience checks
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Test deployed customer experience
        env:
          WEB_PRODUCTION_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: npm run test:e2e:production
      - name: Record deployment summary
        env:
          WEB_DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          {
            echo "### Controlled-beta deployment candidate"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: $WEB_DEPLOYMENT_URL"
            echo "- External invitations: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
